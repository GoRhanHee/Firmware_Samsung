name: Check firmware update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"
  push:

jobs:
  update:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - model: "SM-G991N"
            csc: "KOO"
            omc: "OKR"
            imei: "351376411210155"
            gki: Non-GKI
          - model: "SM-G973N"
            csc: "KOO"
            omc: "OKR"
            imei: "352582101234566"
            gki: Non-GKI
          - model: "SM-F946N"
            csc: "KOO"
            omc: "OKR"
            imei: "350443701234567"
            gki: GKI 
          - model: "SM-S911N"
            csc: "KOO"
            omc: "OKR"
            imei: "351357511234568"
            gki: GKI    
          - model: "SM-N981N"
            csc: "KOO"
            omc: "OKR"
            imei: "355347581234560"
            gki: Non-GKI
          - model: "SM-N986N"
            csc: "KOO"
            omc: "OKR"
            imei: "355857111234567"
            gki: Non-GKI  
          - model: "SM-A516N"
            csc: "KOO"
            omc: "OKR"
            imei: "354485111234568"
            gki: Non-GKI    
          - model: "SM-G986N"
            csc: "KOO"
            omc: "OKR"
            imei: "354205111234560"
            gki: Non-GKI      
          - model: "SM-S906N"
            csc: "KOO"
            omc: "OKR"
            imei: "350865891234561"
            gki: GKI 
          - model: "SM-E556B"
            csc: "INS"
            omc: "OXM"
            imei: "358298871234561"
            gki: GKI             

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Compare latest version with current version
        run: |
          need_update=0
          latest=`curl --retry 5 --retry-delay 5 http://fota-cloud-dn.ospserver.net/firmware/${{ matrix.csc }}/${{ matrix.model }}/version.xml | grep latest | sed 's/^[^>]*>//' | sed 's/<.*//'`
          latest_short=`echo $latest | cut -d'/' -f1`
          latest_csc=`echo $latest | cut -d'/' -f2`
          latest_modem=`echo $latest | cut -d'/' -f3`
          current=`cat current.${{ matrix.model }}_${{ matrix.csc }}_${{ matrix.omc }}` || need_update=1
          [[ $latest != $current ]] && need_update=1
          echo "latest_version=$latest" >> $GITHUB_ENV
          echo "latest_shortversion=$latest_short" >> $GITHUB_ENV
          echo "latest_cscversion=$latest_csc" >> $GITHUB_ENV
          echo "need_update=$need_update" >> $GITHUB_ENV

      - name: Free up workflow space
        run: |
          curl -L -o util_free_space.sh https://raw.githubusercontent.com/apache/arrow/main/ci/scripts/util_free_space.sh
          chmod +x util_free_space.sh
          ./util_free_space.sh


      - name: Install dependencies
        if: env.need_update == 1
        run: |
          sudo apt-get update
          sudo apt-get install -y liblz4-tool zip android-sdk-libsparse-utils f2fs-tools linux-modules-extra-$(uname -r) python3 python3-venv unzip

      - name: Install samloader
        if: env.need_update == 1
        run: |
          python3 -m venv py_env
          source py_env/bin/activate
          pip3 install git+https://github.com/ananjaser1211/samloader.git
          deactivate

      - name: Fetch firmware
        if: env.need_update == 1
        run: |
          source py_env/bin/activate
          mkdir "${{ matrix.model }}_${{ matrix.csc }}"
          # https://github.com/ExtremeXT/ExtremeROM/blob/v2.6.1/scripts/download_fw.sh#L169-L192
          C=1
          while true; do
              samloader -m ${{ matrix.model }} -r ${{ matrix.csc }} -i ${{ matrix.imei }} download -O "${{ matrix.model }}_${{ matrix.csc }}" || true
              ZIP_FILE="$(find "${{ matrix.model }}_${{ matrix.csc }}" -name "*.zip" | sort -r | head -n 1)"
              if [[ ! "$ZIP_FILE" ]] || [[ ! -f "$ZIP_FILE" ]]; then
                  if [[ "$C" -gt 10 ]]; then
                      exit 1
                  fi
                  echo -e "[Attempt: $C] Download failed, retrying in 5 seconds..."
                  sleep 5
                  ((C++))
              else
                  break
              fi
          done
          cd "${{ matrix.model }}_${{ matrix.csc }}"
          unzip "*.zip" 
          rm -rvf "*.zip"
          cd ..
          deactivate
          rm -rf py_env

      - name: Get path of files
        if: env.need_update == 1
        run: |
          echo "ap_tar=`find -name AP*`" >> $GITHUB_ENV
          echo "bl_tar=`find -name BL*`" >> $GITHUB_ENV
          echo "cp_tar=`find -name CP*`" >> $GITHUB_ENV
          echo "csc_tar=`find -name CSC*`" >> $GITHUB_ENV
          echo "home_csc_tar=`find -name HOME_CSC*`" >> $GITHUB_ENV

      - name: Check downloaded firmware version
        if: env.need_update == 1
        run: |
          version_short=`echo ${{ env.ap_tar }} | cut -d'_' -f3`
          version_csc=`echo ${{ env.csc_tar }} | cut -d'_' -f4`
          version_modem=`echo ${{ env.cp_tar }} | cut -d'_' -f3`
          [[ $version_short == ${{ env.latest_shortversion }} ]]
          [[ $version_csc == ${{ env.latest_cscversion }} ]]
          echo PDA version: $version_short > versions.txt
          echo CSC version: $version_csc >> versions.txt
          echo Modem version: $version_modem >> versions.txt

      - name: Extract Stock Kernel Images
        if: env.need_update == 1
        env:
          FILES: boot.img.lz4 dtbo.img.lz4
        run: |
          for file in $FILES; do tar xvf ${{ env.ap_tar }} ${file}; done
          if tar -tf ${{ env.ap_tar }} vendor_boot.img.lz4 > /dev/null 2>&1; then
            tar xvf ${{ env.ap_tar }} vendor_boot.img.lz4
          fi
          if tar -tf ${{ env.ap_tar }} vbmeta.img.lz4 > /dev/null 2>&1; then
            tar xvf ${{ env.ap_tar }} vbmeta.img.lz4
          fi
          tar cvf ${{ env.latest_shortversion }}_kernel.tar *.lz4
          rm -f *.lz4

      - name: Extract PIT file
        if: env.need_update == 1
        run: |
          tar --wildcards --exclude='*/*' -xvf ${{ env.csc_tar }} '*.pit'
          echo "pit_file=`find -name *.pit`" >> $GITHUB_ENV

      - name: Generate patched vbmeta
        if: env.need_update == 1
        run: |
          if tar -tf ${{ env.ap_tar }} vbmeta.img.lz4 > /dev/null 2>&1; then
            tar xvf ${{ env.ap_tar }} vbmeta.img.lz4
          elif tar -tf ${{ env.bl_tar }} vbmeta.img.lz4 > /dev/null 2>&1; then
            tar xvf ${{ env.bl_tar }} vbmeta.img.lz4
          fi
          if [ ! -f vbmeta.img.lz4 ]; then
            echo "vbmeta.img.lz4 not found in Stock Firmware. Skipping patch."
            exit 0
          fi
          lz4 -d vbmeta.img.lz4 vbmeta.img
          rm -f vbmeta.img.lz4
          printf "$(printf '\\x%02X' 3)" | dd of="vbmeta.img" bs=1 seek=123 count=1 conv=notrunc &> /dev/null
          tar cvf ${{ env.latest_shortversion }}_patched_vbmeta.tar vbmeta.img
          rm -f vbmeta.img

      - name: Extract init_boot.img (for Magisk, KernelSU LKM)
        if: env.need_update == 1      
        run: |
          if tar -tf ${{ env.ap_tar }} init_boot.img.lz4 > /dev/null 2>&1; then
            tar xvf ${{ env.ap_tar }} init_boot.img.lz4
            lz4 -d init_boot.img.lz4 init_boot.img
            rm -f init_boot.img.lz4          
            tar cvf ${{ env.latest_shortversion }}_init_boot.tar init_boot.img
            rm -f init_boot.img
          fi  

      - name: Extract recovery.img
        if: env.need_update == 1      
        run: |
          tar xvf ${{ env.ap_tar }} recovery.img.lz4
          lz4 -d recovery.img.lz4 recovery.img
          rm -f recovery.img.lz4          
          tar cvf ${{ env.latest_shortversion }}_recovery.tar recovery.img
          rm -f recovery.img

      - name: Extract vendor and vendor_dlkm partition
        if: env.need_update == 1
        run: |
          tar tf ${{ env.ap_tar }} > ap_list.txt          
          if grep -q "super.img.lz4" ap_list.txt; then
            tar xvf ${{ env.ap_tar }} super.img.lz4
            rm -f ${{ env.ap_tar }}
            lz4 -d super.img.lz4 super.img
            rm -f super.img.lz4
            simg2img super.img super_raw.img
            mv -f super_raw.img super.img             
            ./tools/lpunpack -p vendor super.img .
            if [ ${{ matrix.gki }} == "GKI" ]; then
              ./tools/lpunpack -p vendor_dlkm super.img .
            fi              
            rm -f super.img
          elif grep -q "vendor.img.lz4" ap_list.txt; then
            tar xvf ${{ env.ap_tar }} vendor.img.lz4
            lz4 -d vendor.img.lz4 vendor.img
            if img2simg -v vendor.img /dev/null 2>/dev/null; then
              simg2img vendor.img vendor_raw.img
              mv -f vendor_raw.img vendor.img
            fi         
          fi
          if [[ -e vendor.img ]]; then
            zip ${{ env.latest_shortversion }}_vendor.zip vendor.img
            rm -f vendor.img
          fi
          if [[ -e vendor_dlkm.img ]]; then
            zip ${{ env.latest_shortversion }}_vendor_dlkm.zip vendor_dlkm.img
            rm -f vendor_dlkm.img
          fi                         

      - name: Update current version
        if: env.need_update == 1
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git pull origin ${{github.ref}} --ff-only
          echo ${{ env.latest_version }} > current.${{ matrix.model }}_${{ matrix.csc }}_${{ matrix.omc }}
          git add current.${{ matrix.model }}_${{ matrix.csc }}_${{ matrix.omc }}
          git commit -m "${{ matrix.model }}: ${{ env.latest_shortversion }}"
          git tag "${{ env.latest_shortversion }}_${{ matrix.csc }}_${{ matrix.omc }}"

      - name: Push changes to repo
        if: env.need_update == 1
        uses: ad-m/github-push-action@master
        with:
          tags: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release assets
        if: env.need_update == 1
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          body_path: versions.txt
          tag_name: "${{ env.latest_shortversion }}_${{ matrix.csc }}_${{ matrix.omc }}"
          name: "${{ env.latest_shortversion }} - ${{ matrix.model }} - ${{ matrix.csc }} - ${{ matrix.omc }}"
          fail_on_unmatched_files: false
          files: |
            ${{ env.bl_tar }}
            ${{ env.cp_tar }}
            ${{ env.home_csc_tar }}
            ${{ env.latest_shortversion }}_kernel.tar
            ${{ env.pit_file }}
            ${{ env.latest_shortversion }}_patched_vbmeta.tar
            ${{ env.latest_shortversion }}_init_boot.tar
            ${{ env.latest_shortversion }}_vendor.zip
            ${{ env.latest_shortversion }}_vendor_dlkm.zip
